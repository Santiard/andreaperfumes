services:
  db:
    image: mariadb:11.4
    container_name: andreaperfumes_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
      MARIADB_DATABASE: ${DB_DATABASE:-andreaperfumes}
      MARIADB_USER: ${DB_USERNAME:-andrea_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-andrea_secret_pass}
      TZ: America/Bogota
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - andrea_net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: andreaperfumes_php
    restart: unless-stopped
    working_dir: /var/www/html/backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-andreaperfumes}
      DB_USERNAME: ${DB_USERNAME:-andrea_user}
      DB_PASSWORD: ${DB_PASSWORD:-andrea_secret_pass}
      JWT_SECRET: ${JWT_SECRET:-andrea_perfumes_jwt_super_secret_key_2026}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      WEBP_MAX_DIMENSION: ${WEBP_MAX_DIMENSION:-1000}
      WEBP_QUALITY: ${WEBP_QUALITY:-82}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      TZ: America/Bogota
    volumes:
      - ./backend:/var/www/html/backend
      - ./frontend:/var/www/html/frontend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - andrea_net

  nginx:
    image: nginx:1.27-alpine
    container_name: andreaperfumes_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html/backend:ro
      - ./frontend:/var/www/html/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - andrea_net

volumes:
  mariadb_data:
    driver: local

networks:
  andrea_net:
    driver: bridge

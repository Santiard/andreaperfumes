server {
    listen 80;
    server_name _;

    root /var/www/html/backend/public;
    index index.php index.html;

    client_max_body_size 15M;

    # Compresión Gzip para respuestas JSON y activos estáticos
    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Servir archivos compilados del frontend React si existen en /frontend/dist
    location /assets/ {
        alias /var/www/html/frontend/dist/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Enrutar todas las peticiones de API y rutas web (con inyección SEO) hacia PHP
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
